AutoName: Gestión de Clientes UTTEC
Summary: Aplicación móvil de gestión de clientes, PokéAPI, contactos y escáner QR.
Description: |-
  Aplicación móvil desarrollada en Flutter que incluye:
  - Autenticación con Firebase Auth y persistencia local con SharedPreferences.
  - CRUD de Clientes y Clasificaciones en tiempo real con Cloud Firestore.
  - Consumo de API REST pública de Pokémon (PokéAPI).
  - Integración de contactos del dispositivo con envío de bienvenida a la UTTEC por WhatsApp.
  - Lector de código de barras y códigos QR con apertura automática de URLs.

